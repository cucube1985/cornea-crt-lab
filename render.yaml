# Paid deployment proposal. Creating/syncing this Blueprint provisions billable resources.
# Review the current Render price and approve the cost before creating the service.
services:
  - type: web
    name: cornea-crt-lab
    runtime: node
    repo: https://github.com/cucube1985/cornea-crt-lab
    branch: codex/server-login
    region: singapore
    plan: 0.5c-512mb
    numInstances: 1
    autoDeployTrigger: "off"
    buildCommand: npm test
    startCommand: node server.mjs
    healthCheckPath: /healthz
    disk:
      name: cornea-accounts
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_DATA_DIR
        value: /var/data/cornea
      - key: TRUST_PROXY
        value: "0"
      - key: ADMIN_INITIAL_PASSWORD
        sync: false
